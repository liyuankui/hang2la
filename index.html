<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>从夯到拉 · AI 智能排榜</title>
  <meta name="description" content="输入主题和条目,AI 一键分档:夯/顶级/人上人/NPC/拉完了。拖拽微调,导出 PNG,免费模型可用。">
  <meta property="og:title" content="从夯到拉 · AI 智能排榜">
  <meta property="og:description" content="AI 帮你排,拖拽随你改——夯/顶级/人上人/NPC/拉完了">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>从夯到拉</h1>
      <span class="badge" data-i18n="badge">AI 排榜</span>
      <button id="btn-lang" class="ghost" title="Language">EN</button>
      <button id="btn-settings" class="ghost" data-i18n="settings">⚙ 设置</button>
    </div>
    <p class="tagline" data-i18n="tagline">AI 帮你排,拖拽随你改 · 夯 / 顶级 / 人上人 / NPC / 拉完了</p>
  </header>

  <main>
    <section class="card" id="input-card">
      <input id="topic" data-i18n-ph="topic_ph" placeholder="排什么?如:编程语言 / 奶茶品牌 / 羽毛球拍">
      <textarea id="items" rows="8" data-i18n-ph="items_ph" placeholder="每行一个条目,最多 30 个&#10;Java&#10;Go&#10;Rust"></textarea>
      <div class="items-gen">
        <span data-i18n="gen_label">没条目?让 AI 想</span>
        <input id="gen-count" type="number" min="3" max="30" value="10">
        <span data-i18n="gen_unit">个</span>
        <button id="btn-gen-items" class="ghost" data-i18n="gen_btn">✨ AI 列条目</button>
      </div>
      <div class="actions">
        <button id="btn-demo" class="ghost" data-i18n="demo">试个示例</button>
        <button id="btn-manual" class="ghost" data-i18n="manual">手动开排</button>
        <button id="btn-ai" class="primary" data-i18n="ai_btn">🔥 智能分档</button>
      </div>
    </section>

    <section id="board-wrap" hidden>
      <div class="board-head">
        <h2 id="board-title"></h2>
        <div class="board-actions">
          <button id="btn-img" class="ghost" data-i18n="img_btn">🎨 AI 配图</button>
          <button id="btn-png" class="ghost" data-i18n="export_png">导出 PNG</button>
          <button id="btn-md" class="ghost" data-i18n="copy_md">复制文案</button>
        </div>
      </div>
      <div id="export-root" class="card">
        <div id="board-title-text" class="export-title"></div>
        <div id="board"></div>
        <div class="export-foot">hang2la · <span data-i18n="export_foot">从夯到拉</span></div>
      </div>
      <p class="hint" data-i18n="board_hint">卡片可拖到别的档位,不满意随时改</p>
    </section>
  </main>

  <footer>
    <a href="https://github.com/liyuankui/hang2la">GitHub</a>
    · <span data-i18n="privacy">API Key 仅存本地浏览器</span>
    · <label><input type="checkbox" id="opt-analytics" checked> <span data-i18n="analytics">匿名统计</span></label>
  </footer>

  <dialog id="settings">
    <h3 data-i18n="settings_title">AI 设置</h3>
    <p id="key-hint" class="hint"><span data-i18n="key_hint">没有 Key?先去领一个免费的:</span><a id="key-url" target="_blank" rel="noopener"></a></p>
    <label><span data-i18n="provider">供应商</span>
      <select id="set-provider"></select>
    </label>
    <label><span data-i18n="base_url">Base URL</span>
      <input id="set-baseurl" placeholder="https://…/v1">
    </label>
    <label><span data-i18n="model">模型</span>
      <div class="model-row">
        <input id="set-model" list="free-models" placeholder="如 google/gemma-4-31b-it:free">
        <button id="btn-fetch-models" class="ghost" type="button" data-i18n="refresh">刷新</button>
      </div>
      <datalist id="free-models"></datalist>
      <span id="free-models-hint" class="hint"></span>
    </label>
    <label><span data-i18n="api_key">API Key</span>
      <input id="set-key" type="password" autocomplete="off" data-i18n-ph="key_ph" placeholder="只存本浏览器">
    </label>
    <p class="hint" data-i18n="settings_privacy">Key 只存在你浏览器的 localStorage,请求只发往你选的供应商。OpenRouter / 智谱 GLM-4-Flash 均有免费额度。</p>
    <div class="actions">
      <button id="set-cancel" class="ghost" data-i18n="cancel">取消</button>
      <button id="set-save" class="primary" data-i18n="save">保存</button>
    </div>
  </dialog>

  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
