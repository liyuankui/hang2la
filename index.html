<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>从夯到拉 · AI 智能排榜</title>
  <meta name="description" content="输入主题和条目,AI 一键分档:夯/顶级/人上人/NPC/拉完了。拖拽微调,导出 PNG,免费模型可用。">
  <meta property="og:title" content="从夯到拉 · AI 智能排榜">
  <meta property="og:description" content="AI 帮你排,拖拽随你改——夯/顶级/人上人/NPC/拉完了">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>从夯到拉</h1>
      <span class="badge">AI 排榜</span>
      <button id="btn-settings" class="ghost" title="AI 设置">⚙ 设置</button>
    </div>
    <p class="tagline">AI 帮你排,拖拽随你改 · 夯 / 顶级 / 人上人 / NPC / 拉完了</p>
  </header>

  <main>
    <section class="card" id="input-card">
      <input id="topic" placeholder="排什么?如:编程语言 / 奶茶品牌 / 羽毛球拍">
      <textarea id="items" rows="8" placeholder="每行一个条目,最多 30 个&#10;Java&#10;Go&#10;Rust"></textarea>
      <div class="actions">
        <button id="btn-demo" class="ghost">试个示例</button>
        <button id="btn-manual" class="ghost">手动开排</button>
        <button id="btn-ai" class="primary">🔥 智能分档</button>
      </div>
    </section>

    <section id="board-wrap" hidden>
      <div class="board-head">
        <h2 id="board-title"></h2>
        <div class="board-actions">
          <button id="btn-img" class="ghost">🎨 AI 配图</button>
          <button id="btn-png" class="ghost">导出 PNG</button>
          <button id="btn-md" class="ghost">复制文案</button>
        </div>
      </div>
      <div id="export-root" class="card">
        <div id="board-title-text" class="export-title"></div>
        <div id="board"></div>
        <div class="export-foot">hang2la · 从夯到拉</div>
      </div>
      <p class="hint">卡片可拖到别的档位,不满意随时改</p>
    </section>
  </main>

  <footer>
    <a href="https://github.com/liyuankui/hang2la">GitHub</a>
    · API Key 仅存本地浏览器
    · <label><input type="checkbox" id="opt-analytics" checked> 匿名统计</label>
  </footer>

  <dialog id="settings">
    <h3>AI 设置</h3>
    <p id="key-hint" class="hint">没有 Key?先去领一个免费的:<a id="key-url" target="_blank" rel="noopener"></a></p>
    <label>供应商
      <select id="set-provider"></select>
    </label>
    <label>Base URL
      <input id="set-baseurl" placeholder="https://…/v1">
    </label>
    <label>模型
      <input id="set-model" placeholder="如 google/gemma-4-31b-it:free">
    </label>
    <label>API Key
      <input id="set-key" type="password" autocomplete="off" placeholder="只存本浏览器">
    </label>
    <p class="hint">Key 只存在你浏览器的 localStorage,请求只发往你选的供应商。OpenRouter / 智谱 GLM-4-Flash 均有免费额度。</p>
    <div class="actions">
      <button id="set-cancel" class="ghost">取消</button>
      <button id="set-save" class="primary">保存</button>
    </div>
  </dialog>

  <div id="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
